<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ store_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  {% block extra_head %}{% endblock %}
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#111827;border-bottom:1px solid rgba(255,255,255,.07)">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('public.index') }}">
      <i class="bi bi-whatsapp" style="color:#25D366;font-size:1.4rem"></i>
      <span class="fw-bold">{{ store_name }}</span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item">
          <a class="nav-link text-secondary" href="{{ url_for('public.demo') }}">Try Demo</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-sm" style="background:#25D366;color:#000;font-weight:600"
             href="{{ url_for('admin.login') }}">Admin Panel</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<!-- Footer -->
<footer style="background:#111827;border-top:1px solid rgba(255,255,255,.07);padding:2rem 0;margin-top:4rem">
  <div class="container text-center text-secondary small">
    <i class="bi bi-whatsapp me-1" style="color:#25D366"></i>
    <strong class="text-white">{{ store_name }}</strong> WhatsApp Bot
    &nbsp;·&nbsp; Built with Flask + WhatsApp Business API
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
