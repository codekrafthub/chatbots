# pytest.ini — Pytest Configuration
# ====================================
# Run tests with:  pytest
# Or via Makefile: make test

[pytest]

# Root directory for test discovery
testpaths = tests

# Show short traceback by default; use -v for verbose
addopts =
    --tb=short
    -q

# Treat these directories as packages (needed for relative imports)
pythonpath = .

# Custom markers used in test files
markers =
    slow:     marks tests as slow (deselect with -m "not slow")
    integration: marks tests that require external services

# Silence specific deprecation warnings from third-party libs
filterwarnings =
    ignore::DeprecationWarning:flask_sqlalchemy
    ignore::DeprecationWarning:sqlalchemy